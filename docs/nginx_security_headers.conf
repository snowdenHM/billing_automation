# Security headers for the pages nginx serves itself.
#
# Django's SecurityHeadersMiddleware covers everything Django answers —
# /api/, /admin/, /media/. It never sees the SPA, because nginx serves
# that straight from dist/:
#
#     root /srv/billmunshi/frontend/dist;
#     location / { try_files $uri /index.html; }
#
# So the pages an operator actually loads had no Content-Security-Policy,
# no X-Frame-Options and no Referrer-Policy at all. The whole app could
# be framed by any site on the internet.
#
# ---------------------------------------------------------------------
# HOW TO APPLY
#
#   sudo cp docs/nginx_security_headers.conf /etc/nginx/snippets/
#   # then, inside `location / { ... }` in the billmunshi server block:
#   include /etc/nginx/snippets/nginx_security_headers.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: nginx's `add_header` does not merge. A block that sets any
# header of its own REPLACES every header inherited from its parent, so
# this include must go in each location that needs them — not only at
# server level. `location /api/` already sets three of its own, and they
# are left alone: Django sets the rest there.
# ---------------------------------------------------------------------

# Clickjacking. The app embeds its own bill previews, so 'self' rather
# than DENY.
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# ---------------------------------------------------------------------
# The full page policy, in report-only first.
#
# Every source below was measured from a real cold load of the live site
# (2026-11-14), not guessed:
#
#   script  : self, plus Cloudflare's analytics beacon
#   style   : self + fonts.googleapis.com, and 'unsafe-inline' because
#             Tailwind and React both emit inline style attributes
#   font    : self + fonts.gstatic.com + data:
#   connect : self, plus the Cloudflare beacon's own endpoint
#
# api.iconify.design and unpkg.com used to belong here. They were
# removed from the app on 2026-11-11 — the icons are bundled now — so
# the policy does not readmit them.
#
# Watch the browser console for a week. When nothing is reported, swap
# the header name to Content-Security-Policy and reload.
# ---------------------------------------------------------------------
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
